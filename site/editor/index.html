<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>隨打注音 · Markdown 編輯器</title>
<meta name="description" content="離線可用的 Markdown 編輯器，內建隨打注音。iPad 接實體鍵盤也能打注音。">
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1f24" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="隨打注音">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest" vite-ignore>
<script>(function(){try{var m=localStorage.getItem("misstype-theme");document.documentElement.dataset.scheme=m==="dark"||m==="light"?m:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){}})()</script>
<link rel="stylesheet" href="../style.css">
</head>
<body class="app">

<div class="chrome">
<header class="bar">
  <a class="brand" href="../" aria-label="回到首頁"><img src="../icon.svg" alt="">隨打注音 <small>Markdown</small></a>
  <div class="bar-actions">
    <button class="tool icon" id="copy-btn" type="button" data-command="copy-md" aria-label="複製 Markdown" title="複製 Markdown"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6"/><path d="M10.5 3.8V4A1.5 1.5 0 0 0 9 2.5H4.5A1.5 1.5 0 0 0 3 4v4.5A1.5 1.5 0 0 0 4.5 10h1"/></svg></button>
    <button class="tool icon" id="clear-btn" type="button" data-command="clear" aria-label="清空" title="清空"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.8 4.5h10.4M6.2 4.5V3h3.6v1.5M4.3 4.5l.6 8.5h6.2l.6-8.5M7 7v3.8M9 7v3.8"/></svg></button>
    <button class="tool icon" id="palette-btn" type="button" data-command="palette" aria-label="指令選單" title="指令選單"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 4.5 7 8l-3.8 3.5M8.5 12h4.3"/></svg></button>
    <button class="tool icon" id="settings-btn" type="button" data-command="settings" aria-label="設定" title="設定"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5h11M2.5 11h11"/><circle cx="6" cy="5" r="1.7"/><circle cx="10.3" cy="11" r="1.7"/></svg></button>
    <button class="theme-toggle" type="button" data-label-auto="跟隨系統" data-label-light="淺色" data-label-dark="深色" aria-label="切換淺色／深色">
      <svg viewBox="0 0 16 16" aria-hidden="true"><g class="i-auto"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11"/></g><g class="i-light"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></g><path class="i-dark" d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z"/></svg>
    </button>
  </div>
</header>

<div class="toolbar" id="toolbar" role="toolbar" aria-label="格式">
  <button type="button" data-action="bold" aria-label="粗體"><b>B</b></button>
  <button type="button" data-action="italic" aria-label="斜體"><i>I</i></button>
  <button type="button" data-action="code" aria-label="行內程式碼"><code>&lt;/&gt;</code></button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" data-action="h1" aria-label="標題 1">H1</button>
  <button type="button" data-action="h2" aria-label="標題 2">H2</button>
  <button type="button" data-action="h3" aria-label="標題 3">H3</button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" data-action="bulletList" aria-label="項目清單">• 清單</button>
  <button type="button" data-action="orderedList" aria-label="編號清單">1. 清單</button>
  <button type="button" data-action="quote" aria-label="引用">❝ 引用</button>
  <button type="button" data-action="codeBlock" aria-label="程式碼區塊">{ } 區塊</button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" data-command="undo" aria-label="復原">↶</button>
  <button type="button" data-command="redo" aria-label="重做">↷</button>
</div>
</div>

<main class="pg" data-theme="system">
  <div id="editor"></div>
</main>

<footer class="status">
  <span id="status" role="status">載入注音中⋯</span>
  <span id="mode-label" title="輕按 Shift 切換中／英">中</span>
  <span id="count">0 字</span>
  <span id="offline"></span>
</footer>

<div id="mode-flash" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="settings" class="sheet" aria-labelledby="settings-title">
  <form method="dialog">
    <h2 id="settings-title">設定</h2>
    <fieldset>
      <legend>注音</legend>
      <label>每頁候選字
        <select data-setting="pageSize">
          <option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" data-setting="shiftToggle"> 輕按 Shift 切換中／英</label>
      <label class="check"><input type="checkbox" data-setting="returnConfirmsSelection"> Enter 確認選取的候選字</label>
      <label class="check"><input type="checkbox" data-setting="autoShowCandidates"> 自動顯示候選窗</label>
      <label>我的詞庫 <button class="tool" type="button" data-open-dictionary>編輯詞庫⋯</button></label>
    </fieldset>
    <fieldset>
      <legend>外觀</legend>
      <label>候選窗排列
        <select data-setting="candidateLayout"><option value="vertical">直式</option><option value="horizontal">橫式</option></select>
      </label>
      <label>候選窗配色
        <select data-setting="candidateTheme">
          <option value="system">預設</option><option value="solarized">Solarized</option><option value="nord">Nord</option>
          <option value="gruvbox">Gruvbox</option><option value="catppuccin">Catppuccin</option>
        </select>
      </label>
      <label>字級
        <select data-setting="fontSize"><option>15</option><option>16</option><option>18</option><option>20</option><option>22</option><option>26</option></select>
      </label>
      <label>版面
        <select data-setting="wrap"><option value="comfortable">舒適（窄欄）</option><option value="wide">全寬</option></select>
      </label>
    </fieldset>
    <p class="hint">設定只存在這個瀏覽器裡。輸入的內容不會傳到任何伺服器。</p>
    <button class="tool primary" type="button" data-close>完成</button>
  </form>
</dialog>

<dialog id="dictionary" class="sheet wide" aria-labelledby="dict-title">
  <form method="dialog" onsubmit="return false">
    <h2 id="dict-title">我的詞庫</h2>
    <p class="hint">打字時按 Shift+←／→ 標記一段文字，再按 Enter 加進詞庫；對同一段再按一次 Enter 就移除。</p>
    <p class="hint">匯入支援 vChewing 使用者資料（.txt，UTF-8）。純詞彙表可用 <a href="https://vu.gh.miniasp.com/" target="_blank" rel="noopener">vChewing 使用者資料產生器</a>（第三方工具，由保哥提供，MIT 授權，與隨打注音無關；在瀏覽器中執行，不會上傳）。</p>
    <textarea id="dict-text" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" rows="12" aria-label="詞庫內容"></textarea>
    <p class="hint">每行一個詞：詞語、空格、以連字號相連的注音（vChewing 使用者資料格式）。行首加 ! 可隱藏內建詞。# 開頭是註解。</p>
    <p class="hint" id="dict-note" role="status"></p>
    <ul class="problems" id="dict-problems"></ul>
    <div class="dict-actions">
      <span id="dict-count"></span>
      <button class="tool" type="button" data-dict="import">匯入⋯</button>
      <button class="tool" type="button" data-dict="export">匯出</button>
      <button class="tool" type="button" data-dict="revert">還原</button>
      <button class="tool primary" type="button" data-dict="save">儲存</button>
      <button class="tool" type="button" data-close>關閉</button>
    </div>
  </form>
</dialog>

<script type="module" src="./editor.js"></script>
<script type="module" src="../theme.js"></script>
<noscript><p class="wrap">此編輯器需要 JavaScript。</p></noscript>
</body>
</html>
