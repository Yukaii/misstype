name: AUR

# VCS packages need recipe updates, not a pkgver bump at every release.
on:
  push:
    paths:
      - linux/aur/PKGBUILD
      - linux/aur/.SRCINFO
      - linux/aur/cxx20.patch
      - LICENSE
      - .github/workflows/aur.yml
      - script/linux/publish_aur.sh
  pull_request:
    paths:
      - linux/aur/PKGBUILD
      - linux/aur/.SRCINFO
      - linux/aur/cxx20.patch
      - LICENSE
      - .github/workflows/aur.yml
      - script/linux/publish_aur.sh
  workflow_dispatch:
    inputs:
      publish:
        description: Push to AUR (main only; otherwise preview only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare packaging preview without credentials
        env:
          AUR_MAINTAINER: ${{ secrets.AUR_MAINTAINER }}
        run: |
          mkdir -p "$RUNNER_TEMP/aur-package"
          cp linux/aur/PKGBUILD linux/aur/cxx20.patch LICENSE "$RUNNER_TEMP/aur-package/"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'aur-package/PKGBUILD'
          maintainer = os.environ['AUR_MAINTAINER']
          if '\n' in maintainer or '\r' in maintainer:
              raise SystemExit('AUR_MAINTAINER must be a single line')
          if maintainer:
              path.write_text('# Maintainer: ' + maintainer + '\n' + path.read_text())
          PY
          # PKGBUILD is executable code: run it only in the credential-free job.
          docker run --rm -v "$RUNNER_TEMP/aur-package:/package" archlinux:base bash -euc '
            pacman -Sy --noconfirm --needed pacman git
            useradd -m builder
            chmod -R a+rwX /package
            cd /package
            runuser -u builder -- env -u MISSTYPE_SOURCE_URL makepkg --printsrcinfo > .SRCINFO
          '
          diff -u linux/aur/.SRCINFO "$RUNNER_TEMP/aur-package/.SRCINFO"
          bash -n script/linux/publish_aur.sh
          cat "$RUNNER_TEMP/aur-package/.SRCINFO"
          printf '### AUR preview\n\nPackaging metadata validated. Download `aur-package` to review the four files. This job does not build the package or access AUR credentials.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aur-package
          path: ${{ runner.temp }}/aur-package/
          include-hidden-files: true
          retention-days: 7

  publish:
    needs: prepare
    if: >-
      github.repository == 'Yukaii/misstype' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: aur-fcitx5-misstype-git
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aur-package
          path: ${{ runner.temp }}/aur-package
      - name: Synchronize reviewed packaging to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_MAINTAINER: ${{ secrets.AUR_MAINTAINER }}
        run: bash script/linux/publish_aur.sh "$RUNNER_TEMP/aur-package"
