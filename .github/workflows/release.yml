name: Release

# Push a tag like v0.2.0 to publish a GitHub Release with a DMG.
# Signing/notarization activates only when the secrets below exist; without
# them the DMG is ad-hoc signed (usable after `xattr -dr com.apple.quarantine`).
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD   Developer ID Application .p12
#   NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID, NOTARY_ISSUER_ID   App Store Connect API key
#   SPARKLE_ED_PRIVATE_KEY   Sparkle EdDSA private key (generate_keys -x); with it
#     the release also carries appcast.xml, which installed copies poll for
#     updates. The public half is committed in Resources/SparklePublicKey.txt.
#     See docs/release.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.2.0-rc1); artifact-only unless publish is enabled"
        type: string
        required: true
      publish:
        description: "Publish a GitHub Release for an existing version tag"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-26
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_ID != '' }}
      HAS_SPARKLE: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Match the source SHA in the OIDC certificate, even if the ref moves.
          ref: ${{ github.sha }}

      - name: Verify build source
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Checkout does not match the attested source commit.'
            exit 1
          fi
          if [[ "$PUBLISH" == 'true' && "$GITHUB_REF" != "refs/tags/$VERSION" ]]; then
            echo '::error::Publishing requires dispatching at the version tag (--ref <tag> -f version=<tag>), not a branch.'
            exit 1
          fi

      # Pinned public dictionary sources only (checksum-verified).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache
          key: lexicon-${{ hashFiles('third_party/*/sources.json') }}

      - name: Test
        run: swift test

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Prepare notary key
        if: env.HAS_NOTARY == 'true'
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Prepare Sparkle key
        if: env.HAS_SPARKLE == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed.key"
          echo "SPARKLE_ED_KEY_FILE=$RUNNER_TEMP/sparkle_ed.key" >> "$GITHUB_ENV"

      - name: Package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./script/package_release.sh "$VERSION"

      # Package includes signing, notarization/stapling, and final checksums.
      # Attest these exact downloadable bytes; no packaging runs afterwards.
      - name: Attest final release artifacts
        # Native attestations are unavailable for user-owned private repos.
        # Enable automatically when the maintainer makes the repo public.
        if: github.event.repository.visibility == 'public'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/Misstype-*.dmg*
            dist/MisstypeIME-*.zip*
            dist/appcast.xml

      - name: Include verification bundle
        if: github.event.repository.visibility == 'public'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/build-provenance.sigstore.json

      - name: Note deferred attestation
        if: github.event.repository.visibility != 'public'
        run: |
          echo '::notice::Build attestation is deferred until this repository is public.'
          printf '### Build provenance\n\nNo build attestation was generated: this repository is private. Attestation will enable automatically when the repository is public.\n' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Misstype-${{ env.VERSION }}
          path: |
            dist/Misstype-*.dmg*
            dist/MisstypeIME-*.zip*
            dist/appcast.xml
            dist/build-provenance.sigstore.json

      - name: Publish release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          [[ "$VERSION" == *-* ]] && PRERELEASE="--prerelease"
          ASSETS=(dist/Misstype-*.dmg dist/Misstype-*.dmg.sha256 dist/MisstypeIME-*.zip dist/MisstypeIME-*.zip.sha256)
          [[ -f dist/build-provenance.sigstore.json ]] && ASSETS+=(dist/build-provenance.sigstore.json)
          [[ -f dist/appcast.xml ]] && ASSETS+=(dist/appcast.xml)
          # Upload every asset before publication locks an immutable release.
          gh release create "$VERSION" "${ASSETS[@]}" \
            --draft --verify-tag --title "Misstype ${VERSION#v}" --generate-notes $PRERELEASE
          gh release edit "$VERSION" --draft=false

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle_ed.key"
