name: Release

# Push a tag like v0.2.0 to publish a GitHub Release with a DMG.
# Signing/notarization activates only when the secrets below exist; without
# them the DMG is ad-hoc signed (usable after `xattr -dr com.apple.quarantine`).
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD   Developer ID Application .p12
#   NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID, NOTARY_ISSUER_ID   App Store Connect API key
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.2.0-rc1); builds an artifact, no release"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      # Pinned public dictionary sources only (checksum-verified).
      - uses: actions/cache@v4
        with:
          path: .cache
          key: lexicon-${{ hashFiles('third_party/*/sources.json') }}

      - name: Test
        run: swift test

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Prepare notary key
        if: env.HAS_NOTARY == 'true'
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./script/package_release.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: Mistype-${{ env.VERSION }}
          path: dist/Mistype-*.dmg*

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          [[ "$VERSION" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$VERSION" dist/Mistype-*.dmg dist/Mistype-*.dmg.sha256 \
            --title "Mistype ${VERSION#v}" --generate-notes $PRERELEASE

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
