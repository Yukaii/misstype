name: Pages

# Builds site/ with Vite on every change to it (PRs included) and publishes
# site/dist to GitHub Pages from main.
# Deploy is off until Pages is set up: enable Pages with source "GitHub
# Actions" in the repository settings, then set the repository variable
# PAGES_ENABLED=true. A manual run (workflow_dispatch) deploys regardless.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "core-zig/**"
      - "script/zig/**"
      - "Resources/**"
      - "script/prepare_lexicon.py"
      - "script/build_site_assets.sh"
      - "script/prepare_site_notices.mjs"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "third_party/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "core-zig/**"
      - "script/zig/**"
      - "Resources/**"
      - "script/prepare_lexicon.py"
      - "script/build_site_assets.sh"
      - "script/prepare_site_notices.mjs"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "third_party/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The demo's wasm decoder and lexicons are generated, not committed
  # (site/public/ is gitignored); without them the live demo 404s.
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned Zig toolchain
        uses: actions/cache@v4
        with:
          path: .cache/zig
          key: zig-pages-${{ runner.arch }}-${{ hashFiles('script/zig/bootstrap.sh') }}
      - name: Cache generated demo assets
        id: assets-cache
        uses: actions/cache@v4
        with:
          # site/public is generated from the core sources, utf8proc, the
          # pinned lexicons and Resources; site-only changes reuse it instead
          # of rebuilding the wasm decoder on every PR (~2 minutes).
          path: site/public
          key: site-assets-${{ runner.os }}-${{ hashFiles('script/zig/bootstrap.sh') }}-${{ hashFiles('core-zig/src/**', 'core-zig/build.zig', 'core-zig/build.zig.zon', 'third_party/**', 'Resources/**', 'script/prepare_lexicon.py', 'script/build_site_assets.sh') }}
      - name: Generate demo assets
        if: steps.assets-cache.outputs.cache-hit != 'true'
        run: script/build_site_assets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: site-assets
          path: site/public
          retention-days: 1

  build:
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: site-assets
          path: site/public
      - run: npm ci && node ../tests/editor_markdown_test.mjs && node ../tests/editor_notes_test.mjs && node ../tests/editor_sync_test.mjs && node ../tests/editor_content_test.mjs && node ../tests/editor_workspace_test.mjs && node ../tests/editor_arrows_test.mjs && node ../tests/editor_vkeys_test.mjs && node ../tests/editor_hwkeyboard_test.mjs && npm run build
        working-directory: site
        env:
          # Public OAuth app key / client ID for the editor's cloud sync (docs/editor.md); unset hides it.
          VITE_DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.PAGES_ENABLED == 'true')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
