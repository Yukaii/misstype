name: Pages

# Builds site/ with Vite on every change to it (PRs included) and publishes
# site/dist to GitHub Pages from main.
# Deploy is off until Pages is set up: enable Pages with source "GitHub
# Actions" in the repository settings, then set the repository variable
# PAGES_ENABLED=true. A manual run (workflow_dispatch) deploys regardless.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "Sources/**"
      - "Package.swift"
      - "Resources/**"
      - "script/prepare_lexicon.py"
      - "script/build_site_assets.sh"
      - "script/prepare_site_notices.mjs"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "third_party/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "Sources/**"
      - "Package.swift"
      - "Resources/**"
      - "script/prepare_lexicon.py"
      - "script/build_site_assets.sh"
      - "script/prepare_site_notices.mjs"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "third_party/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The demo's wasm decoder and lexicons are generated, not committed
  # (site/public/ is gitignored); without them the live demo 404s.
  assets:
    runs-on: ubuntu-latest
    container: swift:6.0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y python3 unzip curl
      - run: script/build_site_assets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: site-assets
          path: site/public
          retention-days: 1

  build:
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: site-assets
          path: site/public
      - run: npm ci && npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.PAGES_ENABLED == 'true')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
