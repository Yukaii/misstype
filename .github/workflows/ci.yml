name: CI

# Keeps the Swift reference and Zig port portable and checks their parity.
# macOS shipping behavior is exercised by release.yml until its C ABI cutover.
# Site and docs-only changes skip it (the site has its own build in pages.yml).
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-zig-port:
    # Compile the macOS-facing ABI on the platform that supplies lipo and
    # SwiftPM's InputMethodKit headers. The UI remains on the Swift oracle
    # until the bridge is switched over; this gate keeps both architectures
    # and the ABI exports buildable while that migration proceeds.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned Zig toolchain
        uses: actions/cache@v4
        with:
          path: .cache/zig
          key: zig-macos-${{ runner.arch }}-${{ hashFiles('script/zig/bootstrap.sh') }}
      - name: Build universal Zig C ABI
        run: script/zig/build_macos.sh
      - name: Compile Swift packages and C ABI reference
        run: swift build --build-tests
      - name: Link and run Swift-to-Zig smoke test
        run: swift run MisstypeZigSmoke

  zig-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned Zig toolchain and compiler
        uses: actions/cache@v4
        with:
          path: |
            .cache/zig
            ~/.cache/zig
            core-zig/.zig-cache
          key: zig-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('script/zig/bootstrap.sh') }}-${{ hashFiles('third_party/utf8proc/*', 'core-zig/src/*', 'core-zig/build.zig', 'core-zig/build.zig.zon') }}
          restore-keys: |
            zig-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('script/zig/bootstrap.sh') }}-
      - name: Format and test Zig in Debug and ReleaseFast
        run: |
          zig=$(script/zig/bootstrap.sh)
          cd core-zig
          "$zig" fmt --check build.zig src
          "$zig" build test
          "$zig" build test -Doptimize=ReleaseFast

  core-linux:
    runs-on: ubuntu-24.04
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test MisstypeCore
        run: swift test

  # The Linux dev image (Swift + fcitx5 + GTK) is published to GHCR keyed by the
  # Dockerfile hash, so it builds only when linux/Dockerfile changes and every
  # job below just pulls it.
  linux-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo%%/*}/misstype-linux-dev:${{ hashFiles('linux/Dockerfile') }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for a published image
        id: exists
        run: |
          if docker manifest inspect "${{ steps.ref.outputs.image }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.found != 'true'
      - name: Build and publish the Linux test image
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: linux
          file: linux/Dockerfile
          tags: ${{ steps.ref.outputs.image }}
          push: true
          cache-from: type=gha,scope=linux-dev
          cache-to: type=gha,scope=linux-dev,mode=max

  # Independent gates run in parallel instead of one 20+ minute serial job.
  # Each leg gets a fresh source copy and its own Linux-only build cache.
  fcitx5-linux:
    needs: linux-image
    name: linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: swift reference C ABI and addon, exact decoder parity
            run: |
              script/linux/dev.sh 'MISSTYPE_CORE=swift script/ci/time.sh swift-capi-check script/linux/test_capi.sh && MISSTYPE_CORE=swift script/ci/time.sh swift-addon-check script/linux/test_fcitx5.sh'
              script/ci/time.sh exact-decoder-parity core-zig/bench/compare.sh 10
          - name: zig C ABI and addon, persistence and CLI
            run: |
              script/ci/time.sh zig-capi-addon script/zig/test_linux.sh
              script/ci/time.sh persistence-parity script/zig/test_persistence.sh
              script/ci/time.sh cli-parity script/zig/test_ctl.sh
          - name: installed GTK desktop
            run: script/linux/dev.sh 'script/ci/time.sh linux-tests script/linux/test_all.sh && script/ci/time.sh installed-desktop script/linux/test_desktop.sh'
          - name: full candidates, touch and Unicode parity
            optimize: ReleaseFast
            run: script/ci/time.sh full-candidate-parity core-zig/bench/parity.sh
          - name: debug session replay
            run: script/ci/time.sh debug-replay core-zig/bench/replay.sh 400 1
          - name: ReleaseFast session replay
            optimize: ReleaseFast
            skip_tests: "1"
            run: |
              script/ci/time.sh release-replay-seed-1 core-zig/bench/replay.sh 400 1
              script/ci/time.sh release-replay-seed-487 core-zig/bench/replay.sh 400 487
    env:
      MISSTYPE_LINUX_PREBUILT: "1"
      MISSTYPE_LINUX_BUILD_CACHE: "1"
      MISSTYPE_LINUX_IMAGE: ${{ needs.linux-image.outputs.image }}
      MISSTYPE_ZIG_OPTIMIZE: ${{ matrix.optimize }}
      MISSTYPE_REPLAY_SKIP_TESTS: ${{ matrix.skip_tests || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the Linux test image
        run: docker pull "$MISSTYPE_LINUX_IMAGE"
      - name: Cache container SwiftPM and Zig builds
        uses: actions/cache@v4
        with:
          path: .cache/linux-build
          # Separate legs avoid competing saves; image/toolchain changes must
          # never restore incompatible builds. Source changes use incremental
          # compiler validation, then save a new snapshot at this commit.
          key: linux-build-v1-${{ runner.arch }}-${{ hashFiles('linux/Dockerfile', 'script/zig/bootstrap.sh', 'Package.swift', 'Package.resolved') }}-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: |
            linux-build-v1-${{ runner.arch }}-${{ hashFiles('linux/Dockerfile', 'script/zig/bootstrap.sh', 'Package.swift', 'Package.resolved') }}-${{ strategy.job-index }}-
      - name: Cache pinned Zig toolchain and compiler
        uses: actions/cache@v4
        with:
          path: |
            .cache/zig
            ~/.cache/zig
            core-zig/.zig-cache
          key: zig-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('script/zig/bootstrap.sh') }}-${{ hashFiles('third_party/utf8proc/*', 'core-zig/src/*', 'core-zig/build.zig', 'core-zig/build.zig.zon') }}
          restore-keys: |
            zig-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('script/zig/bootstrap.sh') }}-
      - name: Cache public dictionary sources
        uses: actions/cache@v4
        with:
          path: |
            .cache/mcbopomofo
            .cache/naer
            .cache/frequencywords
          key: zig-lexicon-${{ hashFiles('third_party/*/sources.json', 'script/prepare_lexicon.py', 'Resources/reading_order.tsv') }}
      - name: Prepare checksum-verified public lexicons
        run: python3 script/prepare_lexicon.py
      - name: ${{ matrix.name }}
        run: |
          TIMEFORMAT='timing: linux-leg wall=%3Rs user=%3Us sys=%3Ss'
          time {
            ${{ matrix.run }}
          }
      - name: Upload synthetic replay diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zig-replay-diagnostics-${{ strategy.job-index }}
          path: |
            build/parity/*
            build/replay/*.txt
            build/replay/*.log
            build/replay/scripts/*.txt
          retention-days: 7
          if-no-files-found: ignore
