name: CI

# Keeps MisstypeCore (decoder + InputSession) portable: the core and its
# tests must build and pass on Linux, where only the core target exists
# (Package.swift gates the macOS adapter). macOS is exercised by release.yml.
# Site and docs-only changes skip it (the site has its own build in pages.yml).
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test MisstypeCore
        run: swift test

  fcitx5-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same image as local development (linux/Dockerfile); tests only, so CI
      # never downloads the lexicon.
      - uses: docker/setup-buildx-action@v3
      - name: Linux test image
        uses: docker/build-push-action@v6
        with:
          context: linux
          file: linux/Dockerfile
          tags: misstype-linux-dev:latest
          load: true
          cache-from: type=gha,scope=linux-dev
          cache-to: type=gha,scope=linux-dev,mode=max
      # A single working copy preserves Swift's incremental release build
      # between the C ABI and addon checks.
      - name: C ABI and fcitx5 addon
        env:
          MISSTYPE_LINUX_PREBUILT: "1"
        run: script/linux/dev.sh 'script/linux/test_capi.sh && script/linux/test_fcitx5.sh'
