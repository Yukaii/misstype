name: CI

# Tests the Zig core (units, behavior suites, golden gates frozen from the retired
# Swift reference), the Linux frontends, the wasm build and the macOS UI side.
# Site and docs-only changes skip it (the site has its own build in pages.yml).
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides what this event needs (script/ci/plan.sh): the 10x-billed macOS job
  # only when Swift-side inputs change, and on a squash merge whose tree already
  # passed as a PR only the main-only depth legs below.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      macos: ${{ steps.plan.outputs.macos }}
      verified: ${{ steps.plan.outputs.verified }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: script/ci/plan.sh

  macos-zig-port:
    # Build the Zig library on the platform that supplies lipo and SwiftPM's
    # InputMethodKit headers, then build the IME against it and run the Swift
    # UI-side tests and the Swift-to-Zig smoke test.
    # CI only needs a dylib its own architecture can load, so it builds the
    # native slice; the universal (x86_64 + arm64) library stays in release.yml.
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      MISSTYPE_MACOS_ARCH: native
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned Zig toolchain and compiler
        uses: actions/cache@v4
        with:
          path: |
            .cache/zig
            ~/.cache/zig
            core-zig/.zig-cache
          key: zig-macos-${{ runner.arch }}-${{ hashFiles('script/zig/bootstrap.sh') }}-${{ hashFiles('third_party/utf8proc/*', 'core-zig/src/**', 'core-zig/build.zig', 'core-zig/build.zig.zon') }}
          restore-keys: |
            zig-macos-${{ runner.arch }}-${{ hashFiles('script/zig/bootstrap.sh') }}-
      - name: Build native Zig C ABI
        run: script/zig/build_macos.sh
      - name: Build the IME and run the Swift UI-side tests
        run: swift test
      - name: Link and run Swift-to-Zig smoke test
        run: swift run MisstypeZigSmoke tests/fixtures/lexicon

  zig-core:
    # Debug and ReleaseFast are independent compiles; run them in parallel
    # instead of one serial job so the wall time is the slower mode, not the sum.
    name: zig-core (${{ matrix.optimize }})
    needs: plan
    if: needs.plan.outputs.verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseFast]
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned Zig toolchain and compiler
        uses: actions/cache@v4
        with:
          path: |
            .cache/zig
            ~/.cache/zig
            core-zig/.zig-cache
          key: zig-core-${{ runner.os }}-${{ runner.arch }}-${{ matrix.optimize }}-${{ hashFiles('script/zig/bootstrap.sh') }}-${{ hashFiles('third_party/utf8proc/*', 'core-zig/src/**', 'core-zig/build.zig', 'core-zig/build.zig.zon') }}
          restore-keys: |
            zig-core-${{ runner.os }}-${{ runner.arch }}-${{ matrix.optimize }}-${{ hashFiles('script/zig/bootstrap.sh') }}-
      - name: Format and test Zig in ${{ matrix.optimize }}
        run: |
          zig=$(script/zig/bootstrap.sh)
          cd core-zig
          "$zig" fmt --check build.zig src
          "$zig" build test -Doptimize=${{ matrix.optimize }}

  # The site demo's WebAssembly build: the same `misstype_wasm_*` exports,
  # exercised by the browser-API suite under Node.
  wasm:
    needs: plan
    if: needs.plan.outputs.verified != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Cache pinned Zig toolchain and compiler
        uses: actions/cache@v4
        with:
          path: |
            .cache/zig
            ~/.cache/zig
            core-zig/.zig-cache
          key: zig-wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('script/zig/bootstrap.sh') }}-${{ hashFiles('third_party/utf8proc/*', 'core-zig/src/*', 'core-zig/build.zig') }}
          restore-keys: |
            zig-wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('script/zig/bootstrap.sh') }}-
      - name: Cache built wasm32-wasi decoder
        id: wasm-build
        uses: actions/cache@v4
        with:
          # A wasm artifact is a pure function of the core sources, utf8proc
          # and the pinned toolchain; reuse it for changes that do not touch
          # those (adapter, CLI, docs-adjacent and site work) and still run
          # the browser suite against it below.
          path: core-zig/zig-out/wasm/misstype.wasm
          key: wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('script/zig/bootstrap.sh') }}-${{ hashFiles('third_party/utf8proc/*', 'core-zig/src/**', 'core-zig/build.zig', 'core-zig/build.zig.zon') }}
      - run: npm ci
        working-directory: site
      - name: Build wasm32-wasi and run the browser API suite
        run: |
          if [ ! -f core-zig/zig-out/wasm/misstype.wasm ]; then
            zig=$(script/zig/bootstrap.sh)
            (cd core-zig && "$zig" build wasm)
          fi
          mkdir -p site/public
          cp core-zig/zig-out/wasm/misstype.wasm site/public/
          node tests/wasm_test.mjs
      - name: Test npm browser bindings
        working-directory: packages/misstype-wasm
        run: |
          npm ci --ignore-scripts
          npm test
          npm pack --dry-run
      # Embeds the full lexicons (pinned public sources) and the wasm built above.
      - name: Build and test the Obsidian plugin
        run: |
          script/build_site_assets.sh --data
          cd packages/obsidian-misstype
          npm ci
          npm run build
          npm test

  # The Linux dev image (fcitx5 + GTK build tools) is published to GHCR keyed by the
  # Dockerfile hash, so it builds only when linux/Dockerfile changes and every
  # job below just pulls it.
  linux-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo%%/*}/misstype-linux-dev:${{ hashFiles('linux/Dockerfile') }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for a published image
        id: exists
        run: |
          if docker manifest inspect "${{ steps.ref.outputs.image }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.found != 'true'
      - name: Build and publish the Linux test image
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: linux
          file: linux/Dockerfile
          tags: ${{ steps.ref.outputs.image }}
          push: true
          cache-from: type=gha,scope=linux-dev
          cache-to: type=gha,scope=linux-dev,mode=max

  # Independent gates run in parallel instead of one 20+ minute serial job.
  # Pull requests use reduced replay/golden samples below; main and manual runs
  # retain the full corpus and candidate/touch parity gate.
  # Each leg gets a fresh source copy and its own Linux-only build cache.
  # Legs marked main_depth run deeper on main (400 replay cases, 10 golden
  # repeats, full parity) and so still run on a verified squash merge; the
  # rest skip their setup entirely when LEG_ON is false.
  fcitx5-linux:
    needs: [plan, linux-image]
    name: linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: exact decoder golden
            optimize: ReleaseFast
            main_depth: true
            run: script/ci/time.sh exact-decoder-golden core-zig/bench/compare.sh "$MISSTYPE_GOLDEN_REPEATS"
          - name: C ABI and addon, persistence and CLI
            run: |
              script/ci/time.sh zig-capi-addon script/zig/test_linux.sh
              script/ci/time.sh persistence-parity script/zig/test_persistence.sh
              script/ci/time.sh cli-parity script/zig/test_ctl.sh
          - name: installed GTK desktop
            run: script/linux/dev.sh 'script/ci/time.sh installed-desktop script/linux/test_desktop.sh'
          - name: full candidates, touch and Unicode golden
            optimize: ReleaseFast
            skip_pr: true
            main_depth: true
            run: script/ci/time.sh full-candidate-parity core-zig/bench/parity.sh
          - name: debug session replay
            # The Debug suite already ran in zig-core; this leg exists for the
            # replay-only behavior (overflow/bounds checks), so skip rebuilding
            # the test binaries here.
            skip_tests: "1"
            main_depth: true
            run: script/ci/time.sh debug-replay core-zig/bench/replay.sh "$MISSTYPE_REPLAY_CASES" 1
          - name: ReleaseFast session replay
            optimize: ReleaseFast
            # Same reason as the debug leg: zig-core covers the optimized tests.
            skip_tests: "1"
            main_depth: true
            run: |
              script/ci/time.sh release-replay-seed-1 core-zig/bench/replay.sh "$MISSTYPE_REPLAY_CASES" 1
              MISSTYPE_REPLAY_SKIP_BUILD=1 script/ci/time.sh release-replay-seed-487 core-zig/bench/replay.sh "$MISSTYPE_REPLAY_CASES" 487
    env:
      LEG_ON: ${{ !(matrix.skip_pr && github.event_name == 'pull_request') && (needs.plan.outputs.verified != 'true' || matrix.main_depth == true) }}
      MISSTYPE_LINUX_PREBUILT: "1"
      MISSTYPE_LINUX_BUILD_CACHE: "1"
      MISSTYPE_LINUX_IMAGE: ${{ needs.linux-image.outputs.image }}
      MISSTYPE_ZIG_OPTIMIZE: ${{ matrix.optimize }}
      MISSTYPE_REPLAY_SKIP_TESTS: ${{ matrix.skip_tests || '0' }}
      MISSTYPE_REPLAY_CASES: ${{ github.event_name == 'pull_request' && '100' || '400' }}
      MISSTYPE_GOLDEN_REPEATS: ${{ github.event_name == 'pull_request' && '2' || '10' }}
    steps:
      - uses: actions/checkout@v4
        if: env.LEG_ON == 'true'
      - uses: docker/login-action@v3
        if: env.LEG_ON == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the Linux test image
        if: env.LEG_ON == 'true'
        run: docker pull "$MISSTYPE_LINUX_IMAGE"
      - name: Cache container Zig and fcitx5 builds
        if: env.LEG_ON == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/linux-build
          # Separate legs avoid competing saves; image/toolchain changes must
          # never restore incompatible builds. Source changes use incremental
          # compiler validation, then save a new snapshot at this commit.
          # The fcitx5 CMake tree is included because the installed-desktop
          # leg spends most of its cold time compiling the addon.
          key: linux-build-v2-${{ runner.arch }}-${{ hashFiles('linux/Dockerfile', 'script/zig/bootstrap.sh') }}-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: |
            linux-build-v2-${{ runner.arch }}-${{ hashFiles('linux/Dockerfile', 'script/zig/bootstrap.sh') }}-${{ strategy.job-index }}-
      - name: Cache pinned Zig toolchain and compiler
        if: env.LEG_ON == 'true'
        uses: actions/cache@v4
        with:
          path: |
            .cache/zig
            ~/.cache/zig
            core-zig/.zig-cache
          key: zig-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('script/zig/bootstrap.sh') }}-${{ hashFiles('third_party/utf8proc/*', 'core-zig/src/*', 'core-zig/build.zig', 'core-zig/build.zig.zon') }}
          restore-keys: |
            zig-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('script/zig/bootstrap.sh') }}-
      - name: Cache public dictionary sources
        if: env.LEG_ON == 'true'
        uses: actions/cache@v4
        with:
          path: |
            .cache/mcbopomofo
            .cache/naer
            .cache/frequencywords
          key: zig-lexicon-${{ hashFiles('third_party/*/sources.json', 'script/prepare_lexicon.py', 'Resources/reading_order.tsv') }}
      - name: Prepare checksum-verified public lexicons
        if: env.LEG_ON == 'true'
        run: python3 script/prepare_lexicon.py
      - name: ${{ matrix.name }}
        if: env.LEG_ON == 'true'
        run: |
          TIMEFORMAT='timing: linux-leg wall=%3Rs user=%3Us sys=%3Ss'
          time {
            ${{ matrix.run }}
          }
      - name: Upload synthetic replay diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zig-replay-diagnostics-${{ strategy.job-index }}
          path: |
            build/parity/*
            build/replay/*.txt
            build/replay/*.log
            build/replay/scripts/*.txt
          retention-days: 7
          if-no-files-found: ignore
