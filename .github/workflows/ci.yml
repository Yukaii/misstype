name: CI

# Keeps MistypeCore (decoder + InputSession) portable: the core and its
# tests must build and pass on Linux, where only the core target exists
# (Package.swift gates the macOS adapter). macOS is exercised by release.yml.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test MistypeCore
        run: swift test
