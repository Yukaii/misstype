name: npm publish

# Publishes packages/misstype-wasm with npm trusted publishing (GitHub OIDC):
# no NPM_TOKEN secret; npm checks this repository and workflow filename
# against the trusted publisher configured on npmjs.com and attaches
# provenance automatically. Tags are `misstype-wasm-vX.Y.Z`, separate from the
# app's `vX.Y.Z` tags, so they never start release.yml or move its baseline.
on:
  push:
    tags: ["misstype-wasm-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (npm publish --dry-run); uncheck only on a misstype-wasm-v* tag"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # OIDC token for npm trusted publishing
    defaults:
      run:
        working-directory: packages/misstype-wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/misstype-wasm/package-lock.json
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" != "misstype-wasm-v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Refuse a real publish outside a tag
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && !startsWith(github.ref, 'refs/tags/misstype-wasm-v')
        run: |
          echo "::error::A real publish must run on a misstype-wasm-v* tag (dispatch with --ref <tag>)"
          exit 1
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Publish
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [[ "$DRY_RUN" == 'true' ]]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
            version=$(node -p "require('./package.json').version")
            printf 'Published **misstype-wasm@%s**: https://www.npmjs.com/package/misstype-wasm/v/%s\n' \
              "$version" "$version" >> "$GITHUB_STEP_SUMMARY"
          fi
